name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: material-gnome-theme

      - name: Build release zip
        run: |
          mkdir -p Material-Gnome
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='screenshots/' \
            material-gnome-theme/ Material-Gnome/
          zip -r Material-Gnome.zip Material-Gnome/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Material-Gnome.zip
          generate_release_notes: true
