name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CSS parser
        run: python -m pip install --disable-pip-version-check tinycss2

      - name: Validate theme assets and stylesheets
        run: python scripts/check-theme.py

      - name: Validate preset rendering
        run: python scripts/apply-theme.py --check themes/Material-Gnome.json

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Test installer in an isolated home
        run: |
          test_home="$RUNNER_TEMP/material-gnome-install-test"
          mkdir -p "$test_home"
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" bash ./install.sh
          test -L "$test_home/.config/gtk-4.0/gtk.css"
          test -L "$test_home/.config/gtk-4.0/gtk-dark.css"
          test -L "$test_home/.config/gtk-4.0/colors.css"
          test -f "$test_home/.themes/Material-Gnome/index.theme"

          # Existing regular files must be backed up before a forced replacement.
          rm "$test_home/.config/gtk-4.0/gtk.css"
          printf 'user-owned config\n' > "$test_home/.config/gtk-4.0/gtk.css"
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" bash ./install.sh --force
          grep -Fxq 'user-owned config' "$test_home/.config/gtk-4.0/gtk.css.bak."*
          test -L "$test_home/.config/gtk-4.0/gtk.css"

      - name: Verify release archive layout
        run: |
          stage="$RUNNER_TEMP/material-gnome-release"
          mkdir -p "$stage/Material-Gnome"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='screenshots/' \
            ./ "$stage/Material-Gnome/"
          (cd "$stage" && zip -qr Material-Gnome.zip Material-Gnome/)
          roots="$(unzip -Z1 "$stage/Material-Gnome.zip" | cut -d/ -f1 | sort -u)"
          test "$roots" = "Material-Gnome"
          unzip -Z1 "$stage/Material-Gnome.zip" | grep -Fxq 'Material-Gnome/index.theme'
