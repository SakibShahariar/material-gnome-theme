name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CSS parser
        run: python -m pip install --disable-pip-version-check tinycss2

      - name: Validate theme assets and stylesheets
        run: python scripts/check-theme.py

      - name: Validate preset rendering
        run: python scripts/apply-theme.py --check themes/Material-Gnome.json

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Verify release archive layout
        run: |
          stage="$RUNNER_TEMP/material-gnome-release"
          mkdir -p "$stage/Material-Gnome"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='screenshots/' \
            ./ "$stage/Material-Gnome/"
          (cd "$stage" && zip -qr Material-Gnome.zip Material-Gnome/)
          roots="$(unzip -Z1 "$stage/Material-Gnome.zip" | cut -d/ -f1 | sort -u)"
          test "$roots" = "Material-Gnome"
          unzip -Z1 "$stage/Material-Gnome.zip" | grep -Fxq 'Material-Gnome/index.theme'
