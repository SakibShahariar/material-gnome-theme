name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CSS parser
        run: python -m pip install --disable-pip-version-check tinycss2

      - name: Validate theme assets and stylesheets
        run: python scripts/check-theme.py

      - name: Validate preset rendering
        run: python scripts/apply-theme.py --dry-run themes/Material-Gnome.json

      - name: Check installer syntax
        run: bash -n install.sh
