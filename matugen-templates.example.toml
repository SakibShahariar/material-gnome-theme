# Merge these template entries into ~/.config/matugen/config.toml.
# Adjust the theme directory if Material GNOME is installed elsewhere.

[templates.material_gnome_gtk3]
input_path = '~/.themes/Material-Gnome/gtk-3.0/colors-template.css'
output_path = '~/.themes/Material-Gnome/gtk-3.0/colors.css'

[templates.material_gnome_gtk4]
input_path = '~/.themes/Material-Gnome/gtk-4.0/colors-template.css'
output_path = '~/.themes/Material-Gnome/gtk-4.0/colors.css'

[templates.material_gnome_shell]
input_path = '~/.themes/Material-Gnome/gnome-shell/gnome-shell-template.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/gnome-shell.css'

# Optional: palette-driven layout templates (matugen counterparts of the
# static presets in gnome-shell/layouts). Change the active one by pointing
# input_path at a different file; merge the rendered output into
# gnome-shell.css (merge-layout.sh in the dotfiles pipeline does this).

[templates.material_gnome_layout_active-layout]
input_path = '~/.themes/Material-Gnome/gnome-shell/layout-templates/active-layout.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/active-layout.css'


[templates.material_gnome_layout_default-transparecy]
input_path = '~/.themes/Material-Gnome/gnome-shell/layout-templates/default-transparecy.css'
